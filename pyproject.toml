[project]
name = "ats-check"
version = "0.1.0"
description = "Local ATS simulation for resumes: parse health, JD match, truth column, advisory AI screen"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pdfplumber>=0.11.10",
    "pymupdf>=2.1",
    "pypdfium2>=5.15.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
ats-check = "ats_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ats_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
