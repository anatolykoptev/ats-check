# Editable synonym / acronym groups. Every form in a group counts as the same requirement.
# The FIRST form is canonical (what a recruiter would type). A requirement matched through a
# non-first form is reported as "form missing" so you can add the canonical spelling too.
# Matching is case-insensitive, whole-word, hyphen/space tolerant. Add your own groups freely.
# A group is a claim that every form IS the same thing: a broader word ('documentation', 'containers',
# 'embeddings', bare 'agentic', 'PM') or a different product ('OpenAI' for 'OpenAI-compatible') is not a form.
